
<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For MRS. Khan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="petals"></div><div class="vignette"></div>

<section class="screen show" id="s0">
<div class="halo"></div>
<div class="content center">
<div class="small">A Special Surprise</div>
<h1>For Mrs. Khan</h1>
<div class="gold-line"></div>
<p>Take a moment...</p>
</div>
</section>

<section class="screen" id="s1">
<div class="content">
<p class="type" data-text="Some moments deserve more than a simple message."></p>
<p class="type delay" data-text="Some deserve a little more time, care and courage."></p>
<button class="next gold">Continue</button>
</div>
</section>

<section class="screen" id="s2">
<div class="content">
<div id="envelope">
<div class="seal"></div>
<div class="flap"></div>
<div class="paper">Open</div>
</div>
<p class="hint">Click the envelope</p>
</div>
</section>

<section class="screen" id="s3">
<div class="content">
<h2>Mrs. Khan...</h2>
<p class="question">Would you honor me by going on a date with me?</p>
<div class="actions">
<button id="yes" class="gold">YES 🌻</button>
<button id="no">NO</button>
</div>
<div id="end">
<div class="bouquet">🌻🌻🌻<br>🌻💛🌻<br>🌻🌻🌻</div>
<h2>Thank You</h2>
<p>You just made my day.<br>I can't wait to spend time with you.</p>
<p class="sign">— Ayaan ❤️</p>
</div>
</div>
</section>
<script src="script.js"></script>
</body></html>
