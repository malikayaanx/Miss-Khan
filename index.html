<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Miss Khan ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins,sans-serif;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#ffd1ff);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:700px;
padding:45px;
text-align:center;
border-radius:25px;
background:rgba(255,255,255,.2);
backdrop-filter:blur(18px);
box-shadow:0 10px 40px rgba(0,0,0,.2);
position:relative;
z-index:10;
}

h1{
font-family:'Great Vibes',cursive;
font-size:65px;
color:#fff;
margin-bottom:10px;
}

h2{
font-size:34px;
color:white;
margin-bottom:20px;
}

p{
color:white;
font-size:20px;
margin-bottom:30px;
line-height:1.8;
}

button{
padding:16px 38px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

#yes{
background:#ff4b7d;
color:white;
margin-right:20px;
}

#yes:hover{
transform:scale(1.1);
}

#no{
background:white;
color:#ff4b7d;
position:absolute;
}

#result{
margin-top:35px;
font-size:28px;
color:white;
font-weight:bold;
display:none;
}

.heart{
position:absolute;
color:#ff4b7d;
font-size:22px;
animation:float linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(.4);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div class="card">

<h1>Miss Khan ❤️</h1>

<h2>Hi Beautiful 🌹</h2>

<p>
Every moment with you makes life brighter.<br><br>

So I have just one question...
</p>

<h2>Will you go on a date with me? 🥺❤️</h2>

<div style="position:relative;height:90px;">
<button id="yes">YES ❤️</button>
<button id="no">NO 🙈</button>
</div>

<div id="result">
Yayyyyy!! ❤️<br><br>
I can't wait for our date! 🌹🥰
</div>

</div>

<script>

const no=document.getElementById("no");

function moveButton(){

const x=Math.random()*(window.innerWidth-180);
const y=Math.random()*(window.innerHeight-100);

no.style.left=x+"px";
no.style.top=y+"px";

}

no.addEventListener("mouseover",moveButton);
no.addEventListener("click",moveButton);

const yes=document.getElementById("yes");

yes.onclick=()=>{

document.getElementById("result").style.display="block";

confetti();

}

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=4+Math.random()*4+"s";

heart.style.fontSize=20+Math.random()*25+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,250);

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function confetti(){

for(let i=0;i<250;i++){

particles.push({

x:canvas.width/2,
y:canvas.height/2,
dx:(Math.random()-0.5)*12,
dy:(Math.random()-0.5)*12,
size:5+Math.random()*6,
life:120

});

}

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach((p,index)=>{

ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;

ctx.fillRect(p.x,p.y,p.size,p.size);

p.x+=p.dx;

p.y+=p.dy;

p.dy+=0.08;

p.life--;

if(p.life<=0)
particles.splice(index,1);

});

requestAnimationFrame(animate);

}

animate();

window.onresize=()=>{

canvas.width=window.innerWidth;

canvas.height=window.innerHeight;

}

</script>

</body>
</html>
